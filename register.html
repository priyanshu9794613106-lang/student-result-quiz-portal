<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register | Student Portal</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body>

    <!-- Header -->

    <header>

        <div class="container">

            <h1>Student Portal</h1>

            <nav>

                <a href="index.html">Home</a>

                <a href="login.html">Login</a>

                <a
                    href="register.html"
                    class="active"
                >
                    Register
                </a>

                <a href="quiz.html">Quiz</a>

            </nav>

        </div>

    </header>


    <!-- Registration -->

    <main class="register-section">

        <div class="register-container">

            <div class="register-heading">

                <span>
                    STUDENT REGISTRATION
                </span>

                <h2>
                    Create Your Account
                </h2>

                <p>
                    Register to access your student
                    dashboard and academic services.
                </p>

            </div>


            <div class="register-card">

                <div
                    id="registerMessage"
                    class="register-message"
                ></div>


                <form id="registerForm">


                    <!-- Full Name -->

                    <div class="form-group">

                        <label for="fullName">
                            Full Name
                        </label>

                        <input
                            type="text"
                            id="fullName"
                            placeholder="Enter your full name"
                            required
                        >

                    </div>


                    <!-- Email -->

                    <div class="form-group">

                        <label for="email">
                            Email Address
                        </label>

                        <input
                            type="email"
                            id="email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <!-- Phone -->

                    <div class="form-group">

                        <label for="phone">
                            Mobile Number
                        </label>

                        <input
                            type="tel"
                            id="phone"
                            placeholder="Enter 10-digit mobile number"
                            maxlength="10"
                            required
                        >

                    </div>


                    <!-- Course -->

                    <div class="form-group">

                        <label for="course">
                            Course
                        </label>

                        <select id="course" required>

                            <option value="">
                                Select Course
                            </option>

                            <option value="B.Tech CSE">
                                B.Tech CSE
                            </option>

                            <option value="B.Tech IT">
                                B.Tech IT
                            </option>

                            <option value="BCA">
                                BCA
                            </option>

                            <option value="MCA">
                                MCA
                            </option>

                            <option value="Diploma CSE">
                                Diploma CSE
                            </option>

                        </select>

                    </div>


                    <!-- Semester -->

                    <div class="form-group">

                        <label for="semester">
                            Semester
                        </label>

                        <select id="semester" required>

                            <option value="">
                                Select Semester
                            </option>

                            <option value="1st Semester">
                                1st Semester
                            </option>

                            <option value="2nd Semester">
                                2nd Semester
                            </option>

                            <option value="3rd Semester">
                                3rd Semester
                            </option>

                            <option value="4th Semester">
                                4th Semester
                            </option>

                            <option value="5th Semester">
                                5th Semester
                            </option>

                            <option value="6th Semester">
                                6th Semester
                            </option>

                            <option value="7th Semester">
                                7th Semester
                            </option>

                            <option value="8th Semester">
                                8th Semester
                            </option>

                        </select>

                    </div>


                    <!-- Password -->

                    <div class="form-group">

                        <label for="registerPassword">
                            Password
                        </label>

                        <input
                            type="password"
                            id="registerPassword"
                            placeholder="Create password"
                            required
                        >

                    </div>


                    <!-- Confirm Password -->

                    <div class="form-group">

                        <label for="confirmPassword">
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Confirm password"
                            required
                        >

                    </div>


                    <!-- Terms -->

                    <div class="terms-box">

                        <label>

                            <input
                                type="checkbox"
                                id="terms"
                                required
                            >

                            I agree to the terms and
                            conditions.

                        </label>

                    </div>


                    <!-- Submit -->

                    <button
                        type="submit"
                        class="register-btn"
                    >
                        Create Account
                    </button>

                </form>


                <div class="login-link">

                    <p>
                        Already have an account?

                        <a href="login.html">
                            Login here
                        </a>
                    </p>

                </div>

            </div>

        </div>

    </main>


    <!-- Footer -->

    <footer>

        <p>
            © 2026 Student Result & Quiz Portal
        </p>

        <p>
            Developed using HTML, CSS & JavaScript
        </p>

    </footer>


    <script src="js/script.js"></script>

</body>

</html>
