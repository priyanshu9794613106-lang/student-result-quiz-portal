<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register | Student Result & Quiz Portal</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>


<body>


<!-- ================= HEADER ================= -->

<header class="site-header">

    <div class="header-container">

        <a
            href="index.html"
            class="brand"
        >
            Student Portal
        </a>


        <nav class="main-navigation">

            <a
                href="index.html"
                class="nav-link"
            >
                Home
            </a>

            <a
                href="login.html"
                class="nav-link"
            >
                Login
            </a>

            <a
                href="register.html"
                class="nav-link"
            >
                Register
            </a>

            <a
                href="quiz.html"
                class="nav-link"
            >
                Quiz
            </a>

            <a
                href="online-tests.html"
                class="nav-link"
            >
                Online Tests
            </a>

        </nav>

    </div>

</header>


<!-- ================= REGISTRATION ================= -->

<main class="form-page">


    <div class="form-card">


        <h1>
            Create Your Account
        </h1>


        <p>
            Register to access your student dashboard,
            online tests and academic services.
        </p>


        <form id="registerForm">


            <!-- FULL NAME -->

            <div class="form-group">

                <label for="fullName">
                    Full Name
                </label>

                <input
                    type="text"
                    id="fullName"
                    name="fullName"
                    placeholder="Enter your full name"
                    autocomplete="name"
                    required
                >

            </div>


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    autocomplete="email"
                    required
                >

            </div>


            <!-- MOBILE -->

            <div class="form-group">

                <label for="phone">
                    Mobile Number
                </label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter 10-digit mobile number"
                    maxlength="10"
                    inputmode="numeric"
                    autocomplete="tel"
                    required
                >

            </div>


            <!-- COURSE -->

            <div class="form-group">

                <label for="course">
                    Course
                </label>

                <select
                    id="course"
                    name="course"
                    required
                >

                    <option value="">
                        Select Course
                    </option>

                    <option value="B.Tech CSE">
                        B.Tech CSE
                    </option>

                    <option value="BCA">
                        BCA
                    </option>

                    <option value="MCA">
                        MCA
                    </option>

                    <option value="Diploma CSE">
                        Diploma CSE
                    </option>

                    <option value="Other">
                        Other
                    </option>

                </select>

            </div>


            <!-- SEMESTER -->

            <div class="form-group">

                <label for="semester">
                    Semester
                </label>

                <select
                    id="semester"
                    name="semester"
                    required
                >

                    <option value="">
                        Select Semester
                    </option>

                    <option value="1st Semester">
                        1st Semester
                    </option>

                    <option value="2nd Semester">
                        2nd Semester
                    </option>

                    <option value="3rd Semester">
                        3rd Semester
                    </option>

                    <option value="4th Semester">
                        4th Semester
                    </option>

                    <option value="5th Semester">
                        5th Semester
                    </option>

                    <option value="6th Semester">
                        6th Semester
                    </option>

                    <option value="7th Semester">
                        7th Semester
                    </option>

                    <option value="8th Semester">
                        8th Semester
                    </option>

                </select>

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Create a password"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="form-group">

                <label for="confirmPassword">
                    Confirm Password
                </label>

                <input
                    type="password"
                    id="confirmPassword"
                    name="confirmPassword"
                    placeholder="Confirm your password"
                    autocomplete="new-password"
                    minlength="6"
                    required
                >

            </div>


            <!-- TERMS -->

            <div
                style="
                    display:flex;
                    align-items:flex-start;
                    gap:10px;
                    margin-bottom:20px;
                "
            >

                <input
                    type="checkbox"
                    id="terms"
                    name="terms"
                    style="
                        width:18px;
                        height:18px;
                        margin-top:3px;
                    "
                    required
                >

                <label
                    for="terms"
                    style="
                        font-size:14px;
                        color:#667085;
                        cursor:pointer;
                    "
                >
                    I agree to the terms and conditions.
                </label>

            </div>


            <!-- SUBMIT -->

            <button
                type="submit"
                class="form-button"
            >
                Create Account
            </button>


        </form>


        <!-- LOGIN LINK -->

        <div class="form-footer">

            Already have an account?

            <a href="login.html">
                Login here
            </a>

        </div>


    </div>

</main>


<!-- ================= FOOTER ================= -->

<footer class="site-footer">

    <div class="footer-container">

        <div class="footer-bottom">

            © 2026 Student Result & Quiz Portal.
            Developed using HTML, CSS & JavaScript.

        </div>

    </div>

</footer>


<!-- IMPORTANT: JAVASCRIPT -->

<script src="js/script.js"></script>


</body>

</html>
